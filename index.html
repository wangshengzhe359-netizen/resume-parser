<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历信息提取工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f6fa;--surface:#fff;--border:#e2e5f0;--text:#1a1d2b;--text-secondary:#6b7094;--primary:#4f6ef7;--primary-hover:#3b5ae0;--primary-light:#eef1fe;--success:#22c55e;--success-bg:#f0fdf4;--danger:#ef4444;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.06);--shadow-lg:0 4px 24px rgba(0,0,0,.08)}
html{font-size:15px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:32px 24px}
.app{max-width:1100px;margin:0 auto}
.header{margin-bottom:28px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-left h1{font-size:1.6rem;font-weight:700;display:flex;align-items:center;gap:10px}
.header-left h1 svg{width:30px;height:30px;color:var(--primary)}
.header-left p{color:var(--text-secondary);margin-top:4px;font-size:.92rem}
.header-right{font-size:.84rem;display:flex;align-items:center;gap:6px}
.badge{display:inline-block;background:var(--primary-light);color:var(--primary);font-size:.75rem;padding:3px 10px;border-radius:20px;font-weight:600}
.drop-zone{background:var(--surface);border:2px dashed var(--border);border-radius:var(--radius);padding:48px 24px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
.drop-zone:hover{border-color:var(--primary);background:var(--primary-light)}
.drop-zone.dragover{border-color:var(--primary);background:var(--primary-light)}
.drop-zone.has-file{border-style:solid;border-color:var(--success);background:var(--success-bg);padding:20px 24px}
.drop-zone-icon{font-size:2.4rem;margin-bottom:12px;color:var(--text-secondary)}
.drop-zone.has-file .drop-zone-icon{font-size:1.6rem;margin-bottom:0;color:var(--success)}
.drop-zone-text{color:var(--text-secondary);font-size:.95rem}
.drop-zone-text strong{color:var(--primary);font-weight:600}
.drop-zone-hint{font-size:.82rem;color:var(--text-secondary);margin-top:8px}
.drop-zone input[type=file]{display:none}
.file-list{margin-top:12px;display:none}
.file-list.show{display:block}
.file-list-item{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;font-size:.85rem}
.file-list-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-list-item .size{color:var(--text-secondary);font-size:.78rem;white-space:nowrap}
.file-list-item .status{font-size:.78rem;white-space:nowrap}
.file-list-item .status.done{color:var(--success)}
.file-list-item .status.fail{color:var(--danger)}
.file-list-item .status.wait{color:var(--text-secondary)}
.file-list-item .status.processing{color:var(--primary)}
.drop-zone-reset{cursor:pointer;color:var(--danger);font-size:.82rem;background:none;border:none;text-decoration:underline}
.status-bar{margin-top:16px;display:none}
.status-bar.active{display:flex;align-items:center;gap:10px}
.spinner{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.controls{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:9px 20px;border-radius:8px;border:none;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .15s;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-outline{background:transparent;color:var(--text-secondary);border:1.5px solid var(--border)}
.btn-outline:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){background:#dc2626}
.table-wrap{margin-top:24px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-header{padding:14px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:space-between}
.table-header .count{font-weight:400;color:var(--text-secondary);font-size:.85rem}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:720px}
thead{background:var(--bg)}
th{padding:12px 14px;text-align:left;font-weight:600;color:var(--text-secondary);font-size:.83rem;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8f9ff}
td input{width:100%;border:1px solid transparent;padding:4px 6px;border-radius:4px;font-size:.88rem;font-family:inherit;background:transparent;transition:border-color .15s}
td input:focus{outline:none;border-color:var(--primary);background:#fff}
td input:hover{border-color:var(--border)}
.table-empty{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.table-empty svg{width:48px;height:48px;color:var(--border);margin-bottom:12px}
.table-empty p{font-size:.9rem}
.table-empty-extra{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.row-actions button{background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:2px;border-radius:4px;transition:color .15s}
.row-actions button:hover{color:var(--danger)}
.raw-text-wrap{margin-top:12px;display:none}
.raw-text-wrap.open{display:block}
.raw-text-toggle{background:none;border:none;color:var(--text-secondary);font-size:.85rem;cursor:pointer;text-decoration:underline}
.raw-text-toggle:hover{color:var(--primary)}
.raw-text-box{margin-top:8px;padding:14px;border-radius:8px;background:#fafafa;border:1px solid var(--border);white-space:pre-wrap;font-size:.82rem;font-family:"SF Mono",Menlo,monospace;max-height:400px;overflow-y:auto;line-height:1.6}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#1a1d2b;color:#fff;padding:12px 24px;border-radius:8px;font-size:.88rem;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .25s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
@media(max-width:640px){body{padding:16px 12px}.drop-zone{padding:32px 16px}.controls{flex-direction:column}.btn{justify-content:center}.header{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <h1>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        简历信息提取
      </h1>
      <p>支持批量上传，一次处理多份简历</p>
    </div>
    <div class="header-right"><span class="badge">纯本地 · 隐私安全</span></div>
  </div>

  <div class="drop-zone" id="dropZone">
    <div class="drop-zone-icon" id="dropIcon">📄</div>
    <div class="drop-zone-text" id="dropText">拖拽简历文件到此处，或 <strong>点击选择文件</strong></div>
    <div class="drop-zone-hint">支持 PDF、PNG、JPG 格式 · 可一次选择多份</div>
    <div class="file-list" id="fileList"></div>
    <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.webp" multiple>
  </div>

  <div class="status-bar" id="statusBar">
    <div class="spinner"></div>
    <span id="statusText">正在解析简历...</span>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="btnExtractAll" disabled>📄 提取全部（<span id="fileCount">0</span> 份）</button>
    <button class="btn btn-outline" id="btnExportCsv" disabled>📥 导出 CSV</button>
    <button class="btn btn-outline" id="btnCopyTable" disabled>📋 复制表格</button>
    <button class="btn btn-outline" id="btnExportData">💾 导出数据</button>
    <button class="btn btn-danger" id="btnClearAll">🗑 清空</button>
  </div>

  <div class="table-wrap">
    <div class="table-header">
      <span>候选人信息</span>
      <span class="count" id="rowCount">共 0 人</span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:28px">#</th>
            <th>姓名</th>
            <th>性别</th>
            <th>学校</th>
            <th>学院</th>
            <th>专业</th>
            <th>就读年限</th>
            <th>联系电话</th>
            <th style="width:50px"></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="9"><div class="table-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg><p>暂无数据，上传简历开始提取</p><div class="table-empty-extra"><button class="btn btn-outline" onclick="loadSampleData()" style="font-size:.82rem;padding:5px 14px">加载示例数据</button></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="raw-text-wrap" id="rawTextWrap">
    <button class="raw-text-toggle" id="rawTextToggle">显示提取的原始文本</button>
    <div class="raw-text-box" id="rawTextBox" style="display:none"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let candidates=[],fileQueue=[],rawTexts={},isProcessing=false,saveTimer=null;
const STORAGE_KEY='resume_data_v4',$=id=>document.getElementById(id);
const DZ=$('dropZone'),FI=$('fileInput'),FL=$('fileList'),SB=$('statusBar'),ST=$('statusText');
const BE=$('btnExtractAll'),FC=$('fileCount'),BC=$('btnExportCsv'),BT=$('btnCopyTable'),BD=$('btnExportData'),BL=$('btnClearAll');
const TB=$('tableBody'),RC=$('rowCount'),RW=$('rawTextWrap'),RT=$('rawTextToggle'),RB=$('rawTextBox');

(function init(){load();render();})();
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(candidates))}catch(e){}}
function load(){try{const d=localStorage.getItem(STORAGE_KEY);if(d){const p=JSON.parse(d);if(Array.isArray(p))candidates=p}}catch(e){}}

let tt;function toast(m,e){clearTimeout(tt);const el=$('toast');el.textContent=m;el.classList.add('show');el.style.background=e?'#dc2626':'#1a1d2b';tt=setTimeout(()=>el.classList.remove('show'),3000);}
function loadSampleData(){candidates=[{name:'张三',gender:'男',school:'北京大学',college:'信息科学技术学院',major:'计算机科学与技术',years:'2018.09 - 2022.06',phone:'13800138000'},{name:'李四',gender:'女',school:'清华大学',college:'经济管理学院',major:'金融学',years:'2019 - 2023',phone:'13900139000'}];save();render();toast('已加载示例数据');}

// ---- File handling ----
DZ.addEventListener('click',e=>{if(e.target.closest('.drop-zone-reset')||isProcessing)return;FI.click()});
DZ.addEventListener('dragover',e=>{e.preventDefault();DZ.classList.add('dragover')});
DZ.addEventListener('dragleave',()=>DZ.classList.remove('dragover'));
DZ.addEventListener('drop',e=>{e.preventDefault();DZ.classList.remove('dragover');if(!isProcessing&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});
FI.addEventListener('change',()=>{if(FI.files.length&&!isProcessing)addFiles(FI.files)});

function addFiles(files){const valid=['pdf','png','jpg','jpeg','webp'];let n=0;for(const f of files){const ext=f.name.split('.').pop().toLowerCase();if(!valid.includes(ext))continue;if(fileQueue.find(q=>q.name===f.name&&q.size===f.size))continue;fileQueue.push(f);n++}if(!n){toast('没有有效文件',true);return}FI.value='';renderFL();BE.disabled=false;FC.textContent=fileQueue.length;DZ.classList.add('has-file');dropIcon.textContent='📋'}

function renderFL(){if(!fileQueue.length){FL.classList.remove('show');FL.innerHTML='';DZ.classList.remove('has-file');dropIcon.textContent='📄';BE.disabled=true;FC.textContent='0';return}FL.classList.add('show');FL.innerHTML=fileQueue.map((f,i)=>{const sz=f.size>1024*1024?(f.size/1024/1024).toFixed(1)+'MB':(f.size/1024).toFixed(0)+'KB';const st=f._s||'wait';const t=st==='done'?'✅ 完成':st==='fail'?'❌ 失败':st==='go'?'⏳ 处理中...':'⏸ 待处理';return `<div class="file-list-item"><span class="name">📄 ${f.name}</span><span class="size">${sz}</span><span class="status ${st}">${t}</span>${!isProcessing&&st==='wait'?`<button class="drop-zone-reset" onclick="rmFile(${i})">移除</button>`:''}</div>`}).join('')}
function rmFile(i){if(isProcessing)return;fileQueue.splice(i,1);renderFL();if(fileQueue.length){FC.textContent=fileQueue.length}else renderFL()}

// ---- PDF extraction with tolerance grouping ----
async function extractPDF(file){
  const buf=await file.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  let allLines=[];
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);
    const ct=await page.getTextContent();
    const rows=[];
    for(const item of ct.items){
      const y=item.transform[5];
      let placed=false;
      for(const r of rows){if(Math.abs(r.y-y)<=2.5){r.items.push({x:item.transform[4],t:item.str});placed=true;break}}
      if(!placed)rows.push({y,items:[{x:item.transform[4],t:item.str}]});
    }
    for(const r of rows.sort((a,b)=>b.y-a.y)){
      allLines.push(r.items.sort((a,b)=>a.x-b.x).map(i=>i.t).join(''));
    }
  }
  // Merge broken lines
  const m=[];
  for(const l of allLines){const t=l.trim();if(!t)continue;if(m.length&&(/[：，、;:,\-]$/.test(m[m.length-1])||t.length<4||/^[a-z0-9(\-（]/.test(t))){m[m.length-1]+=t;continue}m.push(t)}
  // Clean up: remove spaces between CJK characters
  return m.join('\n').replace(/([\u4e00-\u9fff])\s+([\u4e00-\u9fff])/g,'$1$2').replace(/([\u4e00-\u9fff])\s+([：:])/g,'$1$2');
}

async function extractImage(file){
  if(typeof Tesseract==='undefined'){ST.textContent='正在加载 OCR 引擎...';await new Promise((rs,rj)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=rs;s.onerror=rj;document.head.appendChild(s)})}
  return (await Tesseract.recognize(file,'chi_sim+eng',{logger:m=>{if(m.status==='recognizing text')ST.textContent=`OCR 识别中... ${(m.progress*100).toFixed(0)}%`}})).data.text;
}

// ---- Batch extract ----
BE.addEventListener('click',async()=>{
  if(isProcessing||!fileQueue.length)return;
  isProcessing=true;BE.disabled=true;SB.classList.add('active');
  let ok=0,fail=0;
  for(let i=0;i<fileQueue.length;i++){
    const f=fileQueue[i];f._s='go';renderFL();
    ST.textContent=`正在处理 ${i+1}/${fileQueue.length}：${f.name}`;
    try{
      const ext=f.name.split('.').pop().toLowerCase();
      const text=ext==='pdf'?await extractPDF(f):await extractImage(f);
      rawTexts[f.name]=text;
      candidates.push(parseResume(text));
      f._s='done';ok++;
    }catch(err){console.error(f.name,err);f._s='fail';fail++}
    renderFL();
  }
  save();render();SB.classList.remove('active');isProcessing=false;
  if(fileQueue.length){const ln=fileQueue[fileQueue.length-1].name;if(rawTexts[ln]){RB.textContent=rawTexts[ln];RW.classList.add('open');RB.style.display='block'}}
  if(fileQueue.every(f=>f._s==='done'||f._s==='fail')){fileQueue=[];renderFL()}
  toast(`✅ 处理完成：成功 ${ok} 份${fail?`，失败 ${fail} 份`:''}`);
});

/* =================================================================
   全新解析引擎 v4 — 多层次匹配
   ================================================================= */
function parseResume(text){
  if(!text)return {name:'',gender:'',school:'',college:'',major:'',years:'',phone:''};
  const t=text.replace(/\r\n?/g,'\n').replace(/\t/g,' ').replace(/\u00a0/g,' ');
  return {
    name:     extractName(t),
    gender:   extractGender(t),
    school:   extractSchool(t),
    college:  extractCollege(t),
    major:    extractMajor(t),
    years:    extractYears(t),
    phone:    extractPhone(t)
  };
}

// Get value after label on same line, or next line
function valAfterLabel(text,label){const r=new RegExp(label+'[：:\\s]*([^\\s\\n，,。、；;]{1,40})');const m=text.match(r);if(m)return m[1].trim();return ''}

// Get next N chars after label
function valNear(text,label,maxDist=80){
  const idx=text.indexOf(label);if(idx===-1)return '';
  const after=text.slice(idx+label.length,idx+label.length+maxDist).replace(/^[：:\s]+/,'');
  const end=after.search(/[\n\r]/);return end>-1?after.slice(0,end).trim():after.trim();
}

function extractName(text){
  // 1. Direct label patterns
  for(const pat of [/姓\s*名[：:\s]*([\u4e00-\u9fff·]{2,4})/,/名\s*字[：:\s]*([\u4e00-\u9fff·]{2,4})/,/姓\s*氏[：:\s]*([\u4e00-\u9fff·]{2,4})/,/Name[：:\s]*([\u4e00-\u9fff·]{2,4})/i,/Candidate[：:\s]*([\u4e00-\u9fff·]{2,4})/i]){
    const m=text.match(pat);if(m)return m[1];
  }
  // 2. Near "姓名" / "名字"
  const idx=text.search(/姓\s*名|名\s*字|姓\s*氏/);
  if(idx>-1){
    const seg=text.slice(idx+4,idx+40).replace(/^[：:\s]+/,'');
    const n=seg.match(/^([\u4e00-\u9fff·]{2,4})/);
    if(n)return n[1];
  }
  // 3. First non-header line
  for(const l of text.split('\n').map(l=>l.trim()).filter(Boolean)){
    if(/^(简历|个人简历|Resume|CV|教育背景|工作经历|项目经验|专业技能|自我评价|联系方式|个人信息|基本资料)/i.test(l))continue;
    const n=l.match(/^([\u4e00-\u9fff·]{2,3})(?:\s|$|[，,。.\d])/);
    if(n&&!/大学|学院|公司|有限|电话|手机|邮箱|@/.test(l))return n[1];
  }
  return '';
}

function extractGender(text){
  // 1. Direct label
  const m=text.match(/性\s*别[：:\s]*([男女])/);
  if(m)return m[1];
  // 2. Near 性别
  const idx=text.search(/性\s*别/);
  if(idx>-1){const seg=text.slice(idx,idx+20);const g=seg.match(/[男女]/);if(g)return g[0]}
  // 3. Common patterns in personal info
  for(const pat of [/[男女性别]+[：:\s]*([男女])/,/([男女])\s*(?:・|·|\s)\s*(?:出生|已婚|未婚|民族|汉)/]){
    const m=text.match(pat);if(m)return m[1];
  }
  // 4. Check for standalone 男/女 in personal info area (first 1/4 of document)
  const head=text.slice(0,Math.floor(text.length/4));
  for(const g of['男','女']){if(head.includes(g))return g}
  return '';
}

function extractSchool(text){
  const lines=text.split('\n');
  // 1. Label patterns
  for(const pat of [/(?:毕业?院校?|就读?院校?|学校|教育背景|学\s*校|毕业学校)[：:\s]*([\u4e00-\u9fff()（）]{2,35}(?:大学|学院|学校|分校|书院))/,
    /([\u4e00-\u9fff()（）]{2,35}(?:大学|学院|学校))\s*[／/]/,
    /([\u4e00-\u9fff()（）]{2,35}(?:大学|学院))\s*[，,。]?\s*(?:[\u4e00-\u9fff]{2,}(?:学院|系))/]){
    const m=text.match(pat);if(m)return m[1].replace(/^(?:毕业?院校?|学校|就读?院校?|教育背景)\s*[：:]\s*/,'');
  }
  // 2. Near "教育背景" or "教育经历" section
  const eduIdx=text.search(/教育背景|教育经历|学\s*历|Education/i);
  if(eduIdx>-1){
    const block=text.slice(eduIdx,eduIdx+300);
    const m=block.match(/([\u4e00-\u9fff()（）]{2,35}(?:大学|学院|学校))/);
    if(m)return m[1];
  }
  // 3. Look at each line for school-like patterns
  for(const l of lines){
    const m=l.match(/([\u4e00-\u9fff()（）]{2,}(?:大学|学院|学校))/);
    if(m){const s=m[1];if(!/^[\u4e00-\u9fff]/.test(s))continue;return s}
  }
  // 4. Fallback: find any university in the whole text
  const fallback=text.match(/([\u4e00-\u9fff()（）]{2,}(?:大学|学院|学校))/);
  return fallback?fallback[1]:'';
}

function extractCollege(text){
  // 1. Direct label
  const m1=text.match(/(?:学\s*院|二级学院|所属学院|院\s*系)[：:\s]*([\u4e00-\u9fff]{2,30})/);
  if(m1)return m1[1];
  // 2. After school name: "XX大学 XX学院"
  const m2=text.match(/(?:[\u4e00-\u9fff]{2,}(?:大学|学院))\s+([\u4e00-\u9fff]{2,}(?:学院))(?:[\s\n]|$|[，,。、])/);
  if(m2&&!/大学/.test(m2[1])&&!/学校/.test(m2[1])&&!/毕业/.test(m2[1])&&!/医[院学]/.test(m2[1]))return m2[1];
  // 3. "XX学院" followed by major/student keyword
  const m3=text.match(/([\u4e00-\u9fff]{2,}(?:学院))\s*(?:专业|就读|学生|本科|硕士|博士|20\d{2})/);
  if(m3&&!/大学/.test(m3[1])&&!/学校/.test(m3[1])&&!/毕业/.test(m3[1])&&!/医[院学]/.test(m3[1]))return m3[1];
  // 4. In education section, look for "XX学院" that isn't a university name
  const eduIdx=text.search(/教育背景|教育经历|学\s*历/);
  if(eduIdx>-1){
    const block=text.slice(eduIdx,eduIdx+400);
    const m=block.match(/([\u4e00-\u9fff]{2,}(?:学院))(?:[\s\n]|$|[，,。、])/);
    if(m&&!/大学/.test(m[1])&&!/学校/.test(m[1])&&!/毕业/.test(m[1])&&!/医[院学]/.test(m[1]))return m[1];
  }
  return '';
}

function extractMajor(text){
  // 1. Direct label
  for(const pat of [/(?:专\s*业|主\s*修|攻\s*读|所学专业|研究方向|方\s*向)[：:\s]*([^\s\n，,。、；;]{2,30})/,
    /([\u4e00-\u9fff]{2,}(?:科学与技术|工程|科学|技术|管理|设计|艺术|教育|文学|理学|工学|法学|经济学|医学|农学|语言学|哲学|历史学|数学|物理|化学|生物|自动化|软件|网络|通信|电子|电气|机械|土木|建筑|材料|环境|食品|药学|护理|临床|口腔|中医|预防|检验|影像|康复|麻醉|金融|会计|财务|市场|营销|国际|贸易|新闻|传播|广告|动画|数字))/]){
    const m=text.match(pat);if(m)return m[1].trim();
  }
  // 2. Near "专业" in text
  const idx=text.search(/专\s*业/);
  if(idx>-1){
    const seg=text.slice(idx+2,idx+60).replace(/^[：:\s]+/,'');
    const m=seg.match(/^([^\s\n，,。、；;]{2,30})/);
    if(m)return m[1].trim();
  }
  // 3. In education lines (date + school + major pattern)
  const edu=text.match(/(?:20\d{2}.*?大学.*?([\u4e00-\u9fff]{2,}(?:工程|科学|技术|管理|经济|金融|法学|文学|理学|医学|教育|艺术)))/);
  if(edu)return edu[1];
  // 4. School+specialization pattern
  const s=text.match(/(?:[\u4e00-\u9fff]{2,}(?:大学|学院))\s+([\u4e00-\u9fff]{2,})(?:\s|$)/);
  if(s&&!/学院|大学|学校/.test(s[1])&&s[1].length>=2)return s[1];
  return '';
}

function extractYears(text){
  // 1. Full date range: 2018.09-2022.06 / 2018年9月-2022年6月
  const f=text.match(/(\d{4})\s*[.年/\-]\s*(\d{1,2})?\s*(?:月)?\s*[-–至到~～]\s*(\d{4})\s*[.年/\-]\s*(\d{1,2})?\s*(?:月)?/);
  if(f){const s=f[2]?`${f[1]}.${f[2].padStart(2,'0')}`:f[1];const e=f[4]?`${f[3]}.${f[4].padStart(2,'0')}`:f[3];return `${s} - ${e}`}
  // 2. Simple: 2018-2022
  const s=text.match(/(\d{4})\s*[-–]\s*(\d{4})\s*(?:年)?/);
  if(s&&s[2]-s[1]>=2&&s[2]-s[1]<=7)return `${s[1]} - ${s[2]}`; // Only if reasonable range (2-7 years)
  // 3. Just a single year range (e.g., education period)
  const c=text.match(/(?:20\d{2})\s*年\s*[-–至到]\s*(\d{4})\s*年/);
  if(c)return c[0].replace(/\s/g,'');
  return '';
}

function extractPhone(text){
  // 1. Mobile
  const m=text.match(/(1[3-9]\d{9})/);if(m)return m[1];
  // 2. Landline
  const l=text.match(/(0\d{2,3}[- ]?\d{7,8})/);return l?l[1]:'';
}

// ---- Render ----
function render(){
  if(!candidates.length){
    TB.innerHTML=`<tr><td colspan="9"><div class="table-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg><p>暂无数据，上传简历开始提取</p></div></td></tr>`;
  } else {
    TB.innerHTML=candidates.map((c,i)=>`<tr data-i="${i}">
      <td style="color:var(--text-secondary);font-size:.82rem">${i+1}</td>
      <td><input value="${esc(c.name)}" data-f="name" data-i="${i}"></td>
      <td><input value="${esc(c.gender)}" data-f="gender" data-i="${i}"></td>
      <td><input value="${esc(c.school)}" data-f="school" data-i="${i}"></td>
      <td><input value="${esc(c.college)}" data-f="college" data-i="${i}"></td>
      <td><input value="${esc(c.major)}" data-f="major" data-i="${i}"></td>
      <td><input value="${esc(c.years)}" data-f="years" data-i="${i}"></td>
      <td><input value="${esc(c.phone)}" data-f="phone" data-i="${i}"></td>
      <td class="row-actions"><button onclick="del(${i})" title="删除"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></td>
    </tr>`).join('');
    document.querySelectorAll('#tableBody input').forEach(inp=>inp.addEventListener('input',onEdit));
  }
  RC.textContent=`共 ${candidates.length} 人`;
  [BC,BT].forEach(b=>b.disabled=!candidates.length);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function onEdit(e){const inp=e.target,idx=parseInt(inp.dataset.i),f=inp.dataset.f;if(!candidates[idx])return;candidates[idx][f]=inp.value;clearTimeout(saveTimer);saveTimer=setTimeout(()=>save(),500)}
function del(i){candidates.splice(i,1);save();render();toast('已删除')}

// ---- Controls ----
BL.addEventListener('click',()=>{if(!candidates.length&&!fileQueue.length)return;if(!confirm('确定清空所有数据？'))return;candidates=[];fileQueue=[];save();render();renderFL();RW.classList.remove('open');RB.style.display='none';BE.disabled=true;toast('已清空')});
BC.addEventListener('click',()=>{if(!candidates.length)return;const h=['姓名','性别','学校','学院','专业','就读年限','联系电话'];const csv='\uFEFF'+h.join(',')+'\n'+candidates.map(c=>[c.name,c.gender,c.school,c.college,c.major,c.years,c.phone].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');const b=new Blob([csv],{type:'text/csv;charset=utf-8;'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='候选人信息.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);toast('✅ CSV 已导出')});
BT.addEventListener('click',async()=>{if(!candidates.length)return;const h=['姓名','性别','学校','学院','专业','就读年限','联系电话'];const t=h.join('\t')+'\n'+candidates.map(c=>[c.name,c.gender,c.school,c.college,c.major,c.years,c.phone].join('\t')).join('\n');try{await navigator.clipboard.writeText(t);toast('✅ 已复制')}catch{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('✅ 已复制')}});
BD.addEventListener('click',()=>{if(!candidates.length){toast('没有数据可导出',true);return}const b=new Blob([JSON.stringify(candidates,null,2)],{type:'application/json;charset=utf-8;'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='候选人数据.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);toast('✅ 数据已导出')});
RT.addEventListener('click',()=>{const h=RB.style.display==='none';RB.style.display=h?'block':'none';RT.textContent=h?'隐藏提取的原始文本':'显示提取的原始文本'});
</script>
