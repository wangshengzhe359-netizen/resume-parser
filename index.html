<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历信息提取工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --border: #e2e5f0;
    --text: #1a1d2b;
    --text-secondary: #6b7094;
    --primary: #4f6ef7;
    --primary-hover: #3b5ae0;
    --primary-light: #eef1fe;
    --success: #22c55e;
    --success-bg: #f0fdf4;
    --warning: #f59e0b;
    --warning-bg: #fffbeb;
    --danger: #ef4444;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 4px 24px rgba(0,0,0,.08);
  }
  html { font-size: 15px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 24px;
  }

  .app { max-width: 1100px; margin: 0 auto; }

  .header { margin-bottom: 28px; display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .header-left h1 {
    font-size: 1.6rem; font-weight: 700;
    display: flex; align-items: center; gap: 10px;
  }
  .header-left h1 svg { width: 30px; height: 30px; color: var(--primary); }
  .header-left p { color: var(--text-secondary); margin-top: 4px; font-size: .92rem; }
  .header-right { text-align: right; font-size: .84rem; display: flex; gap: 6px; align-items: center; }

  .badge {
    display: inline-block; background: var(--primary-light); color: var(--primary);
    font-size: .75rem; padding: 3px 10px; border-radius: 20px; font-weight: 600;
  }

  .drop-zone {
    background: var(--surface);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    position: relative;
  }
  .drop-zone:hover { border-color: var(--primary); background: var(--primary-light); }
  .drop-zone.dragover { border-color: var(--primary); background: var(--primary-light); }
  .drop-zone.has-file { border-style: solid; border-color: var(--success); background: var(--success-bg); padding: 20px 24px; }
  .drop-zone-icon { font-size: 2.4rem; margin-bottom: 12px; color: var(--text-secondary); }
  .drop-zone.has-file .drop-zone-icon { font-size: 1.6rem; margin-bottom: 0; color: var(--success); }
  .drop-zone-text { color: var(--text-secondary); font-size: .95rem; }
  .drop-zone-text strong { color: var(--primary); font-weight: 600; }
  .drop-zone-hint { font-size: .82rem; color: var(--text-secondary); margin-top: 8px; }
  .drop-zone input[type="file"] { display: none; }
  .drop-zone-file { display: flex; align-items: center; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .drop-zone-file-name { font-weight: 600; font-size: .95rem; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drop-zone-file-size { font-size: .82rem; color: var(--text-secondary); }
  .drop-zone-reset {
    cursor: pointer; color: var(--danger); font-size: .82rem;
    background: none; border: none; text-decoration: underline;
  }

  .status-bar { margin-top: 16px; display: none; }
  .status-bar.active { display: flex; align-items: center; gap: 10px; }
  .spinner {
    width: 20px; height: 20px; border: 2.5px solid var(--border);
    border-top-color: var(--primary); border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .controls { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    padding: 9px 20px; border-radius: 8px; border: none;
    font-size: .9rem; font-weight: 600; cursor: pointer;
    transition: background .15s, box-shadow .15s;
    display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-outline {
    background: transparent; color: var(--text-secondary);
    border: 1.5px solid var(--border);
  }
  .btn-outline:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover:not(:disabled) { background: #16a34a; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover:not(:disabled) { background: #dc2626; }

  .table-wrap {
    margin-top: 24px; background: var(--surface);
    border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden;
  }
  .table-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    font-weight: 700; font-size: .95rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .table-header .count { font-weight: 400; color: var(--text-secondary); font-size: .85rem; }
  .table-scroll { overflow-x: auto; }
  table {
    width: 100%; border-collapse: collapse; font-size: .9rem;
    min-width: 720px;
  }
  thead { background: var(--bg); }
  th {
    padding: 12px 14px; text-align: left; font-weight: 600;
    color: var(--text-secondary); font-size: .83rem;
    white-space: nowrap; border-bottom: 1px solid var(--border);
  }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8f9ff; }
  td input {
    width: 100%; border: 1px solid transparent; padding: 4px 6px;
    border-radius: 4px; font-size: .88rem; font-family: inherit;
    background: transparent; transition: border-color .15s;
  }
  td input:focus { outline: none; border-color: var(--primary); background: #fff; }
  td input:hover { border-color: var(--border); }
  .table-empty {
    text-align: center; padding: 60px 20px; color: var(--text-secondary);
  }
  .table-empty svg { width: 48px; height: 48px; color: var(--border); margin-bottom: 12px; }
  .table-empty p { font-size: .9rem; }
  .table-empty-extra { margin-top: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .row-actions { display: flex; gap: 6px; }
  .row-actions button {
    background: none; border: none; cursor: pointer;
    color: var(--text-secondary); padding: 2px; border-radius: 4px;
    transition: color .15s;
  }
  .row-actions button:hover { color: var(--danger); }

  .raw-text-wrap { margin-top: 12px; display: none; }
  .raw-text-wrap.open { display: block; }
  .raw-text-toggle {
    background: none; border: none;
    color: var(--text-secondary); font-size: .85rem;
    cursor: pointer; text-decoration: underline;
  }
  .raw-text-toggle:hover { color: var(--primary); }
  .raw-text-box {
    margin-top: 8px; padding: 14px; border-radius: 8px;
    background: #fafafa; border: 1px solid var(--border);
    white-space: pre-wrap; font-size: .82rem; font-family: "SF Mono", Menlo, monospace;
    max-height: 400px; overflow-y: auto; line-height: 1.6;
  }

  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: #1a1d2b; color: #fff; padding: 12px 24px;
    border-radius: 8px; font-size: .88rem; font-weight: 500;
    box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 640px) {
    body { padding: 16px 12px; }
    .drop-zone { padding: 32px 16px; }
    .controls { flex-direction: column; }
    .btn { justify-content: center; }
    .header { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-left">
      <h1>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        简历信息提取
      </h1>
      <p>上传简历自动提取信息，数据保存在浏览器中</p>
    </div>
    <div class="header-right">
      <span class="badge">纯本地 · 隐私安全</span>
    </div>
  </div>

  <!-- Upload Zone -->
  <div class="drop-zone" id="dropZone">
    <div class="drop-zone-icon" id="dropIcon">📄</div>
    <div class="drop-zone-text" id="dropText">
      拖拽简历文件到此处，或 <strong>点击选择文件</strong>
    </div>
    <div class="drop-zone-hint">支持 PDF、PNG、JPG 格式（浏览器端解析，文件不上传）</div>
    <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.webp">
  </div>

  <!-- Status -->
  <div class="status-bar" id="statusBar">
    <div class="spinner"></div>
    <span id="statusText">正在解析简历...</span>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-primary" id="btnExtract" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      提取信息
    </button>
    <button class="btn btn-outline" id="btnExportCsv" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      导出 CSV
    </button>
    <button class="btn btn-outline" id="btnCopyTable" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      复制表格
    </button>
    <button class="btn btn-outline" id="btnExportData">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      导出数据
    </button>
    <button class="btn btn-outline" id="btnImportData">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      导入数据
    </button>
    <button class="btn btn-danger" id="btnClearAll">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      清空
    </button>
  </div>

  <!-- Table -->
  <div class="table-wrap" id="tableWrap">
    <div class="table-header">
      <span>候选人信息</span>
      <span class="count" id="rowCount">共 0 人</span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:28px">#</th>
            <th>姓名</th>
            <th>性别</th>
            <th>学校</th>
            <th>学院</th>
            <th>专业</th>
            <th>就读年限</th>
            <th>联系电话</th>
            <th style="width:50px"></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="9">
              <div class="table-empty" id="emptyState">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
                <p>暂无数据，请上传简历进行提取</p>
                <div class="table-empty-extra">
                  <button class="btn btn-outline" onclick="loadSampleData()" style="font-size:.82rem;padding:5px 14px">加载示例数据</button>
                  <button class="btn btn-outline" onclick="document.getElementById('importFileInput').click()" style="font-size:.82rem;padding:5px 14px">导入已有数据</button>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Raw text -->
  <div class="raw-text-wrap" id="rawTextWrap">
    <button class="raw-text-toggle" id="rawTextToggle">显示提取的原始文本</button>
    <div class="raw-text-box" id="rawTextBox" style="display:none"></div>
  </div>
</div>

<!-- Hidden file input for import -->
<input type="file" id="importFileInput" accept=".json" style="display:none">

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   简历信息提取工具 v2
   - 改进的 PDF 逐行提取（保留位置信息）
   - 更丰富的解析模式
   - localStorage 持久化
   双击 HTML 即可使用
   ============================================================ */

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ---- State ----
let candidates = [];
let currentFile = null;
let rawText = '';
let saveTimer = null;

const STORAGE_KEY = 'resume_candidates_data_v2';

// ---- DOM refs ----
const $ = id => document.getElementById(id);
const dropZone = $('dropZone');
const fileInput = $('fileInput');
const dropText = $('dropText');
const dropIcon = $('dropIcon');
const statusBar = $('statusBar');
const statusText = $('statusText');
const btnExtract = $('btnExtract');
const btnExportCsv = $('btnExportCsv');
const btnCopyTable = $('btnCopyTable');
const btnClearAll = $('btnClearAll');
const btnExportData = $('btnExportData');
const btnImportData = $('btnImportData');
const importFileInput = $('importFileInput');
const tableBody = $('tableBody');
const rowCount = $('rowCount');
const rawTextWrap = $('rawTextWrap');
const rawTextToggle = $('rawTextToggle');
const rawTextBox = $('rawTextBox');

// ---- Init ----
(function init() {
  loadFromStorage();
  renderTable();
})();

// ---- Storage ----
function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(candidates));
  } catch(e) { console.warn('localStorage save failed', e); }
}
function loadFromStorage() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) { const p = JSON.parse(data); if (Array.isArray(p)) candidates = p; }
  } catch(e) {}
}

// ---- Toast ----
let toastTimer;
function showToast(msg, isError) {
  clearTimeout(toastTimer);
  const el = $('toast');
  el.textContent = msg; el.classList.add('show');
  el.style.background = isError ? '#dc2626' : '#1a1d2b';
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ---- Sample data ----
function loadSampleData() {
  candidates = [
    { name: '张三', gender: '男', school: '北京大学', college: '信息科学技术学院', major: '计算机科学与技术', years: '2018.09 - 2022.06', phone: '13800138000' },
    { name: '李四', gender: '女', school: '清华大学', college: '经济管理学院', major: '金融学', years: '2019 - 2023', phone: '13900139000' },
    { name: '王五', gender: '男', school: '复旦大学', college: '法学院', major: '法学', years: '2017.09 - 2021.06', phone: '13700137000' },
  ];
  saveToStorage(); renderTable(); showToast('已加载示例数据');
}

// ---- File handling ----
dropZone.addEventListener('click', e => { if (e.target.closest('.drop-zone-reset')) return; fileInput.click(); });
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

function handleFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const valid = ['pdf','png','jpg','jpeg','webp'];
  if (!valid.includes(ext)) { showToast('不支持的文件格式', true); return; }
  currentFile = file;
  const size = file.size > 1024*1024 ? (file.size/1024/1024).toFixed(1)+' MB' : (file.size/1024).toFixed(0)+' KB';
  dropZone.classList.add('has-file');
  dropIcon.textContent = '✅';
  dropText.innerHTML = `<div class="drop-zone-file">
    <span class="drop-zone-file-name">${file.name}</span>
    <span class="drop-zone-file-size">${size}</span>
    <button class="drop-zone-reset" id="resetFile">更换文件</button>
  </div>`;
  document.getElementById('resetFile').addEventListener('click', e => { e.stopPropagation(); resetUpload(); });
  btnExtract.disabled = false;
}

function resetUpload() {
  currentFile = null; rawText = '';
  dropZone.classList.remove('has-file');
  dropIcon.textContent = '📄';
  dropText.innerHTML = '拖拽简历文件到此处，或 <strong>点击选择文件</strong>';
  fileInput.value = ''; btnExtract.disabled = true;
  statusBar.classList.remove('active');
  rawTextWrap.classList.remove('open'); rawTextBox.style.display = 'none';
}

// ---- Extract ----
btnExtract.addEventListener('click', async () => {
  if (!currentFile) return;
  btnExtract.disabled = true; statusBar.classList.add('active');
  statusText.textContent = '正在解析简历...';
  try {
    const ext = currentFile.name.split('.').pop().toLowerCase();
    let text = '';
    if (ext === 'pdf') text = await extractPDF(currentFile);
    else text = await extractImage(currentFile);
    rawText = text;
    statusText.textContent = '正在提取信息...';
    const parsed = parseResume(text);
    candidates.push(parsed);
    saveToStorage(); renderTable();
    showToast('✅ 提取成功');
    // Show raw text for verification
    rawTextBox.textContent = text;
    rawTextWrap.classList.add('open'); rawTextBox.style.display = 'block';
    resetUpload();
  } catch (err) {
    console.error(err);
    showToast('❌ 解析失败：' + err.message, true);
    statusBar.classList.remove('active'); btnExtract.disabled = true;
  }
});

/* =================================================================
   改进的 PDF 提取 — 利用位置信息重建正确的行结构
   ================================================================= */
async function extractPDF(file) {
  const buf = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument({ data: buf }).promise;
  let allLines = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const content = await page.getTextContent();
    // Group items by y-position (rounded) to form lines
    const lineMap = {};
    for (const item of content.items) {
      const y = Math.round(item.transform[5]); // PDF y-coordinate
      const key = 'y' + y;
      if (!lineMap[key]) lineMap[key] = [];
      lineMap[key].push({ x: item.transform[4], text: item.str });
    }
    // Sort y descending (top-to-bottom), x ascending (left-to-right)
    const yKeys = Object.keys(lineMap).sort((a, b) => parseInt(b.slice(1)) - parseInt(a.slice(1)));
    for (const yk of yKeys) {
      const line = lineMap[yk].sort((a, b) => a.x - b.x).map(i => i.text).join('');
      allLines.push(line);
    }
  }
  // Merge short lines that likely belong together
  const merged = [];
  for (const line of allLines) {
    const t = line.trim();
    if (!t) continue;
    if (merged.length > 0) {
      const last = merged[merged.length - 1];
      // If last line ends with punctuation or colon, or this line starts lowercase/number/symbol, merge
      if (/[：，、；:,\-]$/.test(last) || /^[a-z0-9(\-（]/.test(t) || t.length < 4) {
        merged[merged.length - 1] = last + t;
        continue;
      }
    }
    merged.push(t);
  }
  return merged.join('\n');
}

/* =================================================================
   图片 OCR
   ================================================================= */
async function extractImage(file) {
  if (typeof Tesseract === 'undefined') {
    statusText.textContent = '正在加载 OCR 引擎...';
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  }
  const result = await Tesseract.recognize(file, 'chi_sim+eng', {
    logger: m => { if (m.status === 'recognizing text') statusText.textContent = `OCR 识别中... ${(m.progress * 100).toFixed(0)}%`; }
  });
  return result.data.text;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

/* =================================================================
   核心解析器 — 对中文简历的多种常见布局都有覆盖
   ================================================================= */
function parseResume(text) {
  if (!text) return emptyResult();
  const t = text.replace(/\r\n?/g, '\n').replace(/\t/g, ' ').replace(/\u00a0/g, ' ');
  return {
    name: extractName(t),
    gender: extractGender(t),
    school: extractSchool(t),
    college: extractCollege(t),
    major: extractMajor(t),
    years: extractYears(t),
    phone: extractPhone(t)
  };
}

function emptyResult() {
  return { name: '', gender: '', school: '', college: '', major: '', years: '', phone: '' };
}

/* ---- 姓名 ---- */
function extractName(text) {
  // 1. 常见标签：姓名、姓 名、名字
  const m = text.match(/(?:姓\s*名|名\s*字|姓\s*氏|Candidate)[：:\s]*([\u4e00-\u9fff·]{2,4})/);
  if (m) return m[1];
  // 2. 简历顶部：第一行非标题内容，通常是姓名
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  for (const line of lines) {
    // 跳过明显不是名字的行
    if (/^(简历|个人简历|Resume|CV|教育背景|工作经历|项目经验|专业技能|自我评价|联系方式|个人信息)/i.test(line)) continue;
    if (/大学|学院|公司|有限|电话|手机|邮箱|@/.test(line)) continue;
    // 取开头2-3个汉字
    const nm = line.match(/^([\u4e00-\u9fff·]{2,3})/);
    if (nm) return nm[1];
    break;
  }
  return '';
}

/* ---- 性别 ---- */
function extractGender(text) {
  const m = text.match(/性\s*别[：:\s]*([男女])/);
  return m ? m[1] : '';
}

/* ---- 学校 ---- */
function extractSchool(text) {
  const patterns = [
    /(?:毕业?院校?|就读?院校?|学校|教育背景|学\s*校)[：:\s]*([\u4e00-\u9fff()（）]{2,30}(?:大学|学院|学校|分校|书院))/,
    /([\u4e00-\u9fff()（）]{2,30}(?:大学|学院|学校))\s*[／/]\s*/,
    /([\u4e00-\u9fff()（）]{2,}(?:大学|学院|学校))\s*$/,  // 行末的学校名
  ];
  for (const pat of patterns) {
    const m = text.match(pat);
    if (m) return cleanSchool(m[1]);
  }
  // 回退：找常见的大学/学院
  const fallback = text.match(/([\u4e00-\u9fff()（）]{2,}(?:大学|学院|学校))/);
  return fallback ? cleanSchool(fallback[1]) : '';
}

function cleanSchool(s) {
  // 去掉"毕业院校""学校"等前缀，只保留名称
  return s.replace(/^(?:毕业?院校?|学校|就读?院校?|教育背景)\s*[：:]\s*/, '').trim();
}

/* ---- 学院 ---- */
function extractCollege(text) {
  // 学院通常在"XX大学 XX学院"的格式中出现
  // 或跟在"学院："后面
  const m1 = text.match(/(?:学\s*院|二级学院|所属学院)[：:\s]*([\u4e00-\u9fff]{2,30})/);
  if (m1) return m1[1];
  // 找"XX学院"但不包含"大学""学校""毕业"
  const m2 = text.match(/([\u4e00-\u9fff]{2,}(?:学院))\s*(?:专业|就读|学生|本科|硕士|博士|20\d{2})/);
  if (m2 && !/大学/.test(m2[1]) && !/学校/.test(m2[1]) && !/毕业/.test(m2[1]) && !/医[院学]/.test(m2[1])) return m2[1];
  // 教育背景行中找学院名
  const m3 = text.match(/[\u4e00-\u9fff]{2,}(?:大学|学院)\s+([\u4e00-\u9fff]{2,}(?:学院))/);
  if (m3) return m3[1];
  return '';
}

/* ---- 专业 ---- */
function extractMajor(text) {
  const patterns = [
    /(?:专\s*业|主\s*修|攻\s*读|所学专业|研究方向|方\s*向)[：:\s]*([^\s\n，,。、]{2,30})/,
    // "计算机科学与技术" 这种常见专业名
    /([\u4e00-\u9fff]{2,}(?:科学与技术|工程|科学|技术|管理|设计|艺术|教育|文学|理学|工学|法学|经济学|医学|农学|文学|语言学|哲学|历史学|数学|物理|化学|生物|自动化|软件|网络|通信|电子|电气|机械|土木|建筑|材料|环境|食品|药学|护理|临床|口腔|中医|药学|预防|检验|影像|康复|麻醉))/,
  ];
  for (const pat of patterns) {
    const m = text.match(pat);
    if (m) return m[1].trim();
  }
  // 在一些典型布局中，专业出现在教育背景行
  const eduLine = text.match(/(?:20\d{2}.*?大学.*?([\u4e00-\u9fff]{2,}(?:工程|科学|技术|管理|经济|金融|法学|文学|理学|医学)))/);
  return eduLine ? eduLine[1] : '';
}

/* ---- 就读年限 ---- */
function extractYears(text) {
  // 完整格式: 2018.09-2022.06 / 2018年9月-2022年6月
  const full = text.match(/(\d{4})\s*[.年/\-]\s*(\d{1,2})?\s*(?:月)?\s*[-–至到~～]\s*(\d{4})\s*[.年/\-]\s*(\d{1,2})?\s*(?:月)?/);
  if (full) {
    const s = full[2] ? `${full[1]}.${full[2].padStart(2,'0')}` : full[1];
    const e = full[4] ? `${full[3]}.${full[4].padStart(2,'0')}` : full[3];
    return `${s} - ${e}`;
  }
  // 简单: 2018-2022
  const simple = text.match(/(\d{4})\s*[-–]\s*(\d{4})\s*(?:年)?/);
  if (simple) return `${simple[1]} - ${simple[2]}`;
  // "2018年-2022年"
  const cn = text.match(/(\d{4})\s*年\s*[-–至到]\s*(\d{4})\s*年/);
  if (cn) return `${cn[1]} - ${cn[2]}`;
  return '';
}

/* ---- 电话 ---- */
function extractPhone(text) {
  // 手机
  const m = text.match(/(1[3-9]\d{9})/);
  if (m) return m[1];
  // 座机
  const m2 = text.match(/(0\d{2,3}[- ]?\d{7,8})/);
  return m2 ? m2[1] : '';
}

// ---- Render table ----
function renderTable() {
  if (candidates.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="9">
      <div class="table-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        <p>暂无数据，请上传简历进行提取</p>
        <div class="table-empty-extra">
          <button class="btn btn-outline" onclick="loadSampleData()" style="font-size:.82rem;padding:5px 14px">加载示例数据</button>
          <button class="btn btn-outline" onclick="document.getElementById('importFileInput').click()" style="font-size:.82rem;padding:5px 14px">导入已有数据</button>
        </div>
      </div>
    </td></tr>`;
  } else {
    tableBody.innerHTML = candidates.map((c, i) => `<tr data-index="${i}">
      <td style="color:var(--text-secondary);font-size:.82rem">${i+1}</td>
      <td><input type="text" value="${esc(c.name)}" data-field="name" data-idx="${i}"></td>
      <td><input type="text" value="${esc(c.gender)}" data-field="gender" data-idx="${i}"></td>
      <td><input type="text" value="${esc(c.school)}" data-field="school" data-idx="${i}"></td>
      <td><input type="text" value="${esc(c.college)}" data-field="college" data-idx="${i}"></td>
      <td><input type="text" value="${esc(c.major)}" data-field="major" data-idx="${i}"></td>
      <td><input type="text" value="${esc(c.years)}" data-field="years" data-idx="${i}"></td>
      <td><input type="text" value="${esc(c.phone)}" data-field="phone" data-idx="${i}"></td>
      <td class="row-actions">
        <button onclick="deleteRow(${i})" title="删除">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </td>
    </tr>`).join('');
    document.querySelectorAll('#tableBody input').forEach(inp => inp.addEventListener('input', onCellEdit));
  }
  rowCount.textContent = `共 ${candidates.length} 人`;
  [btnExportCsv, btnCopyTable].forEach(b => b.disabled = candidates.length === 0);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function onCellEdit(e) {
  const inp = e.target;
  const idx = parseInt(inp.dataset.idx);
  const field = inp.dataset.field;
  if (!candidates[idx]) return;
  candidates[idx][field] = inp.value;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveToStorage(), 500);
}

function deleteRow(idx) {
  candidates.splice(idx, 1); saveToStorage(); renderTable(); showToast('已删除');
}

// ---- Clear all ----
btnClearAll.addEventListener('click', () => {
  if (candidates.length === 0) return;
  if (!confirm('确定要清空所有数据吗？')) return;
  candidates = []; saveToStorage(); renderTable();
  rawTextWrap.classList.remove('open'); rawTextBox.style.display = 'none';
  showToast('已清空');
});

// ---- Export CSV ----
btnExportCsv.addEventListener('click', () => {
  if (!candidates.length) return;
  const h = ['姓名','性别','学校','学院','专业','就读年限','联系电话'];
  const rows = candidates.map(c => [c.name, c.gender, c.school, c.college, c.major, c.years, c.phone]
    .map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv = '\uFEFF' + h.join(',') + '\n' + rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = '候选人信息.csv';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('✅ CSV 已导出');
});

// ---- Copy table ----
btnCopyTable.addEventListener('click', async () => {
  if (!candidates.length) return;
  const h = ['姓名','性别','学校','学院','专业','就读年限','联系电话'];
  const text = h.join('\t') + '\n' + candidates.map(c => [c.name, c.gender, c.school, c.college, c.major, c.years, c.phone].join('\t')).join('\n');
  try { await navigator.clipboard.writeText(text); showToast('✅ 已复制到剪贴板'); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); showToast('✅ 已复制到剪贴板');
  }
});

// ---- Export data ----
btnExportData.addEventListener('click', () => {
  if (!candidates.length) { showToast('没有数据可导出', true); return; }
  const blob = new Blob([JSON.stringify(candidates, null, 2)], { type: 'application/json;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = '候选人数据.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('✅ 数据已导出');
});

// ---- Import data ----
btnImportData.addEventListener('click', () => importFileInput.click());
importFileInput.addEventListener('change', () => {
  if (!importFileInput.files.length) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('数据格式不正确');
      const before = candidates.length;
      data.forEach(item => {
        if (item && typeof item === 'object') {
          candidates.push({
            name: item.name || '', gender: item.gender || '', school: item.school || '',
            college: item.college || '', major: item.major || '', years: item.years || '', phone: item.phone || ''
          });
        }
      });
      saveToStorage(); renderTable();
      showToast(`✅ 已导入 ${candidates.length - before} 条数据`);
    } catch(err) { showToast('❌ 导入失败：' + err.message, true); }
  };
  reader.readAsText(importFileInput.files[0]);
  importFileInput.value = '';
});

// ---- Raw text toggle ----
rawTextToggle.addEventListener('click', () => {
  const hidden = rawTextBox.style.display === 'none';
  rawTextBox.style.display = hidden ? 'block' : 'none';
  rawTextToggle.textContent = hidden ? '隐藏提取的原始文本' : '显示提取的原始文本';
});
</script>
</body>
</html>
